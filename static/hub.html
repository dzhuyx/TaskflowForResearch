<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskflow hub</title>
<style>
  /* Calendar-app look: a grey sidebar of white cards, soft project colours, rounded pills, system type */
  :root {
    --bg: #ffffff; --ink: #1d1d1f; --muted: #55555a; --faint: #636366; --line: #e5e5ea; --line2: #dcdce1; --panel: #f5f5f7; --soft: #fafafb;
    --accent: #1d63ed; --ok: #1a7f4b; --okink: #13663b; --bad: #c62828; --badink: #a12b2b; --warn: #8a3b00; --warnbg: #fff4e8; --warnline: #f0c99a;
    --donebg: #f4f4f6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* hidden wins over any display rule (Go to session's button) */
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; }
  #app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--line); background: #fbfbfc; }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; }
  header h1 span { font-size: 15px; font-weight: 400; color: var(--faint); }
  header label { color: #3a3a3f; display: inline-flex; gap: 7px; align-items: center; min-height: 32px; }
  header input[type=checkbox] { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }
  #sync { margin-left: auto; color: var(--muted); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
  #sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  #sync.off::before { background: var(--bad); }
  button, a.button { font: inherit; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line2); background: #fff; color: var(--ink); border-radius: 9px;
    padding: 4px 12px; min-height: 32px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  button:hover, a.button:hover { border-color: #b4b4bb; }
  button:focus-visible, a:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary, a.button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .seg { display: flex; gap: 2px; padding: 3px; background: #ededf0; border-radius: 11px; }
  .seg button { border: 0; background: transparent; color: #3a3a3f; border-radius: 9px; min-height: 30px; padding: 0 16px; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) 400px; grid-template-areas: "projects tasks detail"; min-height: 0; }
  section { overflow-y: auto; padding: 18px 16px 40px; min-width: 0; min-height: 0; }
  #projects { grid-area: projects; background: var(--panel); border-right: 1px solid var(--line); }
  #tasks { grid-area: tasks; padding: 18px 20px 40px; }
  #detail { grid-area: detail; border-left: 1px solid var(--line); padding: 18px 20px 40px; }
  .coltitle { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 0 4px 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; }
  .coltitle .n { font-weight: 400; color: var(--faint); }
  .coltitle .aside { font-size: 12px; font-weight: 400; letter-spacing: 0; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  svg.i { flex: none; }
  .muted { color: var(--faint); }
  .foot { font-size: 12px; line-height: 1.5; color: var(--faint); margin: 14px 4px 0; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; word-break: break-all; }
  #pmsg { margin: 0 0 10px; padding: 7px 10px; border-radius: 10px; background: #fdeceb; color: var(--badink); display: none; }
  /* project cards */
  .project { position: relative; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 0 10px; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.04); display: flex; flex-direction: column; gap: 8px; }
  .project.archived { background: var(--soft); }
  .project.archived .name { color: var(--faint); }
  .project .top { display: flex; gap: 10px; align-items: center; }
  .project .ptext { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .project .name { font-weight: 700; font-size: 15px; color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
  a.name:hover { color: var(--accent); }
  .project .file { color: var(--faint); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* the full path is its tooltip */
  button.pemoji { flex: none; width: 36px; height: 36px; min-height: 36px; padding: 0; border: 0; border-radius: 10px; font-size: 18px; line-height: 1; }
  button.pemoji.none { border: 1.5px dashed #c7c7cc; background: #fff; }
  button.pemoji:hover { box-shadow: 0 0 0 2px var(--accent); }
  details.pmenu { position: relative; flex: none; }
  details.pmenu > summary { list-style: none; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 9px; cursor: pointer; }
  details.pmenu > summary::-webkit-details-marker { display: none; }
  details.pmenu > summary:hover, details.pmenu[open] > summary { background: #ededf0; }
  details.pmenu .menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; min-width: 180px; padding: 4px; background: #fff;
    border: 1px solid var(--line2); border-radius: 11px; box-shadow: 0 10px 28px rgba(0,0,0,.14); display: flex; flex-direction: column; }
  details.pmenu .menu button { justify-content: flex-start; border: 0; border-radius: 8px; min-height: 34px; font-weight: 500; }
  details.pmenu .menu button:hover { background: #eef3fe; }
  .emojied, .dled { padding: 9px 10px; border: 1px solid var(--line); border-radius: 11px; background: var(--soft); }
  .emojied .row { margin: 0 0 6px; }
  .emojied input { font: inherit; font-size: 16px; width: 4.4em; padding: 3px 8px; border: 1px solid var(--line2); border-radius: 8px; }
  .emojied .picks { display: flex; flex-wrap: wrap; gap: 2px; }
  .emojied .picks button { font-size: 16px; padding: 0 4px; min-height: 30px; border-color: transparent; background: none; }
  .emojied .picks button:hover { border-color: var(--accent); }
  .emojied .picks button:disabled { opacity: .3; cursor: default; border-color: transparent; }
  .emojied .err, .dled .err, .colored .err { color: var(--badink); margin: 4px 0 0; }
  .colored { padding: 9px 10px; border: 1px solid var(--line); border-radius: 11px; background: var(--soft); display: flex; flex-direction: column; gap: 8px; }
  .colored .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .colored button.sw { width: 30px; height: 30px; min-height: 30px; padding: 0; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line2); }
  .colored button.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
  .colored button.sw:disabled { opacity: .25; cursor: default; }
  .colored .row { margin: 0; }
  .dled .row { margin: 0 0 6px; flex-wrap: nowrap; }
  .dled .dk { flex: none; width: 2.6em; font-size: 12px; font-weight: 600; }
  .dled input { font: inherit; font-size: 12px; padding: 4px 8px; border: 1px solid var(--line2); border-radius: 8px; min-width: 0; }
  .dled input[type="date"] { flex: none; }
  .dled input.what { flex: 1 1 120px; }
  .dled button { flex: none; }
  /* deadlines: hard (external) solid in the project's colour; soft (internal) dashed on its tint */
  .dls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .dl { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0 4px; min-height: 24px; padding: 1px 10px; border-radius: 12px; font-size: 11.5px; font-weight: 600; line-height: 1.35; }
  .dl.soft { border: 1.5px dashed currentColor; }
  .dl.hard { color: #fff; }
  .dl.passed.hard { background: var(--bad) !important; }
  .dl.passed.soft { background: var(--warnbg) !important; color: var(--warn) !important; }
  .dl .what { font-weight: 500; }
  .pbar { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #3a3a3f; }
  .pbar .track { flex: 1; height: 5px; border-radius: 3px; background: #ededf0; overflow: hidden; }
  .pbar .fill { height: 100%; border-radius: 3px; }
  .counts { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); }
  .counts b { color: var(--ink); }
  .counts .act b { color: var(--ok); }
  .problem { color: var(--badink); }
  details.warn { color: var(--warn); font-size: 12px; }
  details.warn summary { cursor: pointer; }
  details.warn p { margin: 3px 0 0 14px; word-break: break-word; }
  .running { display: flex; flex-direction: column; gap: 6px; }
  .running div { display: flex; gap: 9px; align-items: flex-start; padding: 7px 10px; border: 1px solid #ececf0; border-radius: 10px; background: var(--soft); cursor: pointer; }
  .running div:hover { border-color: #b4b4bb; }
  .running div.flag { background: var(--warnbg); border-color: var(--warnline); }
  .running div.sel { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29,99,237,.14); }
  .running .rt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .running .t { font-size: 12.5px; font-weight: 600; }
  .running .t .id { font-weight: 500; color: var(--faint); }
  .running .note { font-size: 11.5px; color: var(--muted); }
  .running div.flag .note { color: var(--warn); }
  .idlehead { font-size: 12px; font-weight: 600; color: var(--faint); margin: 16px 4px 8px; }
  .project.idle { flex-direction: row; align-items: center; gap: 10px; padding: 8px 12px; }
  .project.idle .count { font-size: 12px; color: #3a3a3f; white-space: nowrap; }
  /* the task lists */
  .chipsrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .sumchip { border-radius: 18px; background: var(--soft); border-color: var(--line); font-weight: 500; min-height: 34px; }
  .sumchip.flag { background: var(--warnbg); border-color: var(--warnline); color: var(--warn); }
  #tasks h2 { margin: 16px 0 8px; font-size: 15px; }
  #tasks h2.first { margin-top: 4px; }
  h2 button.fold { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; min-height: 32px; font-weight: 700; color: var(--ink); }
  h2 button.fold::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: 0 4px 3px 2px; }
  h2 button.fold[aria-expanded="false"]::before { transform: rotate(-45deg); margin-bottom: 0; }
  h2 button.fold:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  h2 .count { font-size: 12px; font-weight: 600; color: var(--muted); background: #ededf0; border-radius: 10px; padding: 1px 8px; }
  h2 .sub { font-size: 12px; font-weight: 400; color: var(--faint); }
  .todo { display: flex; flex-direction: column; gap: 6px; }
  .todo div { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid #ececf0; border-radius: 12px; background: #fff; cursor: pointer; }
  .todo div:hover { border-color: #b4b4bb; }
  .todo div.sel { background: #f2f6fe; border-color: #c9d7f5; box-shadow: 0 0 0 3px rgba(29,99,237,.10); }
  .todo .k { flex: none; width: 16px; padding-top: 4px; font-size: 12px; color: var(--muted); text-align: right; }
  .pe { flex: none; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 14px; }
  .pe .dot { width: 9px; height: 9px; border-radius: 50%; }
  .todo .rm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .todo .l1 { font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .todo .l1 .id { color: var(--faint); margin-right: 4px; }
  .todo .l2 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 11.5px; color: var(--muted); }
  .todo .l2 .ic { display: inline-flex; align-items: center; gap: 4px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; min-height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11px; font-weight: 600; border: 1px solid #d7d7dc; color: #3a3a3f; background: #fff; }
  .pill.waiting { background: var(--donebg); }
  .pill.bad { color: var(--badink); border-color: var(--bad); }
  .tiny.dlb { display: inline-flex; align-items: center; min-height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .tiny.dlb.soft { border: 1.5px dashed currentColor; }
  .tiny.dlb.hard { color: #fff; border: 1.5px solid transparent; }
  .tiny.dlb.bad { background: var(--bad) !important; color: #fff !important; border-color: var(--bad) !important; }
  .tiny.dlb.warn { background: var(--warnbg) !important; color: var(--warn) !important; }
  .tiny { font-size: 11px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line2); color: var(--muted); }
  .tiny.bad { color: var(--badink); border-color: var(--bad); }
  .tiny.warn { color: var(--warn); border-color: var(--warn); }
  .warn { color: var(--warn); margin: 4px 0; }
  .fold-problem { padding: 7px 10px; border-radius: 10px; background: var(--warnbg); }
  /* the task details (the board's side panel, static/index.html) */
  #detail .dmeta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  #detail .dmeta .pe { width: 22px; height: 22px; border-radius: 7px; font-size: 12px; }
  #detail h2 { font-size: 20px; color: var(--ink); margin: 0; line-height: 1.3; letter-spacing: -.01em; }
  #detail h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 18px 0 8px; }
  #detail .seg button { flex: 1; min-height: 38px; padding: 0; }   /* its status: Open, In progress, Waiting */
  .donebox { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; margin: 10px 0 8px; }
  .donebox input { width: 22px; height: 22px; margin: 3px 0 0; accent-color: var(--ok); flex: none; cursor: pointer; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; min-height: 24px; padding: 0 10px; border-radius: 12px; background: var(--donebg); color: #3a3a3f; font-size: 11.5px; font-weight: 600; }
  .badge.ready { background: #fff; color: var(--okink); border: 1.5px solid var(--ok); }
  .badge.blocked { background: #fff; color: var(--badink); border: 1.5px solid var(--bad); }
  .badge.done { color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .actions .button, .actions button { min-height: 40px; padding: 0 14px; font-size: 13px; border-radius: 11px; }
  .opengroup { position: relative; display: inline-flex; }   /* Open <main document> | All N: the list of its documents */
  .opengroup > button.opendoc { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  details.docmenu > summary { list-style: none; box-sizing: border-box; display: flex; align-items: center; gap: 5px; min-height: 40px; height: 100%; padding: 0 12px;
    background: var(--accent); color: #fff; border: 1px solid var(--accent); border-left-color: rgba(255,255,255,.45); border-radius: 0 11px 11px 0;
    font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  details.docmenu > summary::-webkit-details-marker { display: none; }
  details.docmenu > summary:hover, details.docmenu[open] > summary { filter: brightness(.92); }
  details.docmenu .menu { position: absolute; left: 0; top: calc(100% + 4px); z-index: 30; width: max-content; min-width: 100%; max-width: 360px; padding: 4px;
    background: #fff; border: 1px solid var(--line2); border-radius: 11px; box-shadow: 0 10px 28px rgba(0,0,0,.14); display: flex; flex-direction: column; }
  .actions details.docmenu .menu button { justify-content: flex-start; flex-wrap: wrap; text-align: left; border: 0; border-radius: 8px; min-height: 34px; padding: 5px 10px; font-size: 12.5px; font-weight: 500; }
  .actions details.docmenu .menu button:hover { background: #eef3fe; }
  details.docmenu .dname { word-break: break-all; }
  textarea { font: inherit; width: 100%; min-height: 48px; resize: vertical; border: 1px solid var(--line2); border-radius: 11px; padding: 8px 10px; }
  textarea.outcome { font-size: 12.5px; }
  .donebox + textarea.outcome { display: block; width: calc(100% - 34px); margin: -2px 0 10px 34px; }   /* under the task's name, lined up with it, as on the board */
  dl.facts { margin: 14px 0 0; padding-top: 14px; border-top: 1px solid #ececf0; display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; font-size: 13px; line-height: 1.4; }
  dl.facts dt { color: var(--faint); }
  dl.facts dd { margin: 0; min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 5px; min-height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--line2); background: #fff; font-size: 12px; cursor: pointer; }
  .chip.done { background: var(--donebg); border-color: transparent; color: var(--muted); }
  .chip.unmet { border-color: var(--bad); color: var(--badink); }
  .chip button.x { min-height: 20px; width: 20px; padding: 0; border: 0; border-radius: 10px; background: transparent; margin-right: -6px; }
  .chip button.x:hover { background: #ededf0; }
  input.addneed { width: 96px; min-height: 28px; padding: 0 10px; border: 1px dashed #c7c7cc; border-radius: 14px; font-size: 12px; }
  .notes p { margin: 0 0 6px; word-break: break-word; color: #3a3a3f; }
  .notes a.link, .doc a { color: var(--accent); cursor: pointer; text-decoration: none; word-break: break-all; font-weight: 500; }
  .notes a.link:hover, .doc a:hover { text-decoration: underline; }
  .docs { display: flex; flex-direction: column; gap: 6px; }
  .doc { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .msg { margin: 8px 0; padding: 7px 10px; border-radius: 10px; background: #e7f4ec; color: var(--okink); display: none; }
  .msg.err { background: #fdeceb; color: var(--badink); }
  .checklist { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 8px; margin: 14px 0 0; }
  .checklist .chead { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); }
  .checklist .chead b { color: var(--ink); font-size: 13px; }
  .checklist .cbar { height: 4px; border-radius: 2px; background: #ececf0; margin: 8px 0 4px; overflow: hidden; }
  .checklist .cbar i { display: block; height: 100%; background: var(--ok); }
  .checklist .step { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 13px; line-height: 1.4; cursor: pointer; }
  .checklist .step input { flex: none; width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--ok); cursor: pointer; }
  .checklist .step.done span { color: var(--muted); text-decoration: line-through; }
  .checklist .step span svg.i { vertical-align: -2px; margin-right: 5px; }   /* a step that names a file to review */
  .checklist .steprow { display: flex; align-items: flex-start; gap: 4px; }
  .checklist .steprow .step { flex: 1; min-width: 0; }
  .checklist .steprow .x { flex: none; width: 26px; height: 26px; margin-top: 3px; border: 0; border-radius: 13px; background: transparent; color: var(--faint); font-size: 16px; line-height: 1; cursor: pointer; opacity: 0; }
  .checklist .steprow:hover .x, .checklist .steprow .x:focus { opacity: 1; }
  .checklist .steprow .x:hover { background: #ececf0; color: var(--ink); }
  .checklist .addstep { width: 100%; min-height: 34px; margin: 6px 0 4px; padding: 0 10px; border: 1px dashed var(--line2); border-radius: 9px; font: inherit; font-size: 13px; background: #fff; }
  .checklist.empty { padding-bottom: 10px; }
  .runbox { background: #fcf5f1; border: 1px solid #f1ddd1; border-radius: 14px; padding: 12px 14px; margin: 14px 0 0; }
  .runbox.quiet { background: #fff6ea; border-color: #f0c99a; }
  .runbox .shead { font-size: 12px; font-weight: 600; color: #8a3b1f; margin-bottom: 6px; }
  .runbox dl { margin: 0; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 6px 10px; font-size: 13px; line-height: 1.4; }
  .runbox dt { color: var(--faint); } .runbox dd { margin: 0; } .runbox dd.look { color: var(--warn); font-weight: 600; }
  .steps { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; } .steps.all { color: var(--okink); }
  .sessionbox { background: var(--soft); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 14px 0 0; display: flex; flex-direction: column; gap: 6px; }
  .sessionbox .live { color: var(--okink); font-size: 12px; font-weight: 600; }
  .sessionbox .shead { font-size: 12px; font-weight: 600; color: var(--muted); }
  .sessionbox code { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; word-break: break-all; }
  details.line { margin-top: 14px; font-size: 12px; color: var(--muted); }
  details.line summary { cursor: pointer; }
  details.line p { margin: 6px 0 0; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; line-height: 1.5; word-break: break-all; color: #3a3a3f; }
  /* the Progress view (progress.py): replaces the project and task columns while it is shown */
  #progress { grid-area: progress; display: none; }

  renderProgress();   // a failed refresh keeps the previous render
}
function setView(v) {
  view = v;
  el("main").classList.toggle("pv", v === "progress");
  el("b-progress").setAttribute("aria-pressed", v === "progress" ? "true" : "false");
  el("b-tasks").setAttribute("aria-pressed", v === "progress" ? "false" : "true");
  saveView();
  if (v === "progress") { renderProgress(); loadProgress(); }
}
el("b-progress").addEventListener("click", () => setView(view === "progress" ? "tasks" : "progress"));   // a second click goes back
el("b-tasks").addEventListener("click", () => setView("tasks"));
let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (view === "progress" && prog) renderProgress(); }, 150); });

// ---------------- loading ----------------
function render(st) {
  state = st;
  state.projects.forEach((p) => { if (!p.deadlines) p.deadlines = []; });   // from a hub server older than deadlines
  const typingDate = dlEdit && document.activeElement && document.activeElement.closest && document.activeElement.closest(".dled");
  if (!typingDate) renderProjects();   // a redraw would lose the place in a date being typed; Save and Cancel redraw the cards
  renderTasks();
}
async function setArchived(path, archived) {
  if (busy) return;
  busy = true;
  const r = await api("/api/hub/archive", { path, archived });
  busy = false;
  if (r.ok) { render(r.data); setSync("saved " + new Date().toLocaleTimeString()); }
  else flashProjects(r.data.error || "Error " + r.status);
}
function setSync(t) { el("sync").textContent = t; el("sync").classList.toggle("off", /not reachable/.test(t)); }
async function poll() {
  const r = await api("/api/hub/version");
  if (!r.ok) { setSync("server not reachable"); return; }
  if (r.data.hash !== hash || Date.now() - lastFull > 60000) {   // also once a minute, for the session activity times
    const changed = r.data.hash !== hash, s = await api("/api/hub");
    if (s.ok) { hash = r.data.hash; lastFull = Date.now(); render(s.data); loadDetail(); if (view === "progress") loadProgress(); setSync((changed ? "updated " : "in sync ") + new Date().toLocaleTimeString()); }
  } else setSync("in sync " + new Date().toLocaleTimeString());
}
el("f-archived").addEventListener("change", () => { if (state) renderProjects(); if (view === "progress" && prog) renderProgress(); });

(async function start() {
  renderDetail();
  const v = await api("/api/hub/version"), s = await api("/api/hub");
  if (!s.ok) { el("projects").textContent = s.data.error || "Could not load the hub."; return; }
  await loadFolded();
  hash = v.ok ? v.data.hash : null;
  lastFull = Date.now();
  render(s.data);
  setView(view);
  setSync("loaded " + new Date().toLocaleTimeString());
  const g = s.data.groups;
  if (NATIVE) NATIVE.postMessage({ kind: "loaded", projects: s.data.projects.filter((p) => !p.archived).length,
    me: g.me.length, handoffs: g.handoff.length, claude: g.claude.length, other: g.other.length });
  setInterval(poll, POLL_MS);
})();
</script>
