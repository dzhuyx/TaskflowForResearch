<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskflow board</title>
<style>
  /* Calendar-app look, as the hub: the project's emoji and name as the title, white cards with a bar for who acts, rounded pills */
  :root {
    --bg: #ffffff; --ink: #1d1d1f; --muted: #55555a; --faint: #636366; --line: #e5e5ea; --line2: #dcdce1; --panel: #f5f5f7; --soft: #fafafb;
    --accent: #1d63ed; --ok: #1a7f4b; --okink: #13663b; --bad: #c62828; --badink: #a12b2b; --warn: #8a3b00; --warnbg: #fff4e8; --warnline: #f0c99a;
    --donebg: #f4f4f6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* hidden wins over any display rule (Go to session's button) */
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; }
  #app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; padding: 14px 20px 10px; background: #fbfbfc; }
  .ptitle { display: flex; align-items: center; gap: 12px; min-width: 0; flex-wrap: wrap; }
  .ptile { flex: none; width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 22px; background: #e9f0fe; }
  .ptile .dot { width: 12px; height: 12px; border-radius: 50%; }
  .ptext { display: flex; flex-direction: column; min-width: 0; }
  .ptext { gap: 2px; }
  header h1 { font-size: 22px; margin: 0; font-weight: 700; letter-spacing: -.015em; line-height: 1.2; }
  .psub { font-size: 12px; color: var(--faint); }
  .dls { display: flex; flex-wrap: wrap; gap: 6px; }
  .dl { display: inline-flex; align-items: center; gap: 0 4px; min-height: 26px; padding: 1px 11px; border-radius: 13px; font-size: 12px; font-weight: 600; }
  .dl.soft { border: 1.5px dashed currentColor; }
  .dl.hard { color: #fff; }
  .dl.passed.hard { background: var(--bad) !important; }
  .dl.passed.soft { background: var(--warnbg) !important; color: var(--warn) !important; }
  .dl .what { font-weight: 500; }
  #sync { margin-left: auto; color: var(--muted); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
  #sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  #sync.off::before { background: var(--bad); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 4px 20px 12px; background: #fbfbfc; border-bottom: 1px solid var(--line); }
  header button, .toolbar button, details.filters > summary { min-height: 40px; border-radius: 10px; font-size: 13px; padding: 0 14px; }
  select, input, textarea, button { font: inherit; }
  button { font-size: 12.5px; font-weight: 600; border: 1px solid var(--line2); background: #fff; color: var(--ink); border-radius: 9px; padding: 4px 12px;
    min-height: 32px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  button:hover { border-color: #b4b4bb; }
  button:focus-visible, summary:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: var(--badink); }
  button:disabled { opacity: .5; cursor: default; }
  svg.i { flex: none; }
  .nav { display: inline-flex; gap: 4px; align-items: center; }
  #b-active .n { color: var(--muted); }
  #nav-pos { color: var(--muted); font-size: 12px; min-width: 3em; }
  #b-prev { width: 40px; padding: 0; }
  .search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 10px; background: #fff; flex: 0 1 260px; min-width: 160px; }
  .search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 13px; }
  .toolbar .seg { border-radius: 10px; }
  .toolbar .seg button { min-height: 34px; border-radius: 8px; padding: 0 12px; font-size: 12.5px; white-space: nowrap; }
  details.filters { position: relative; }
  details.filters > summary { list-style: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line2); background: #fff; font-weight: 600; cursor: pointer; }
  details.filters > summary::-webkit-details-marker { display: none; }
  details.filters[open] > summary, details.filters.on > summary { background: #eef3fe; border-color: #bfd3fb; }
  #fcount { color: var(--accent); }
  details.filters .menu { position: absolute; left: 0; top: calc(100% + 4px); z-index: 30; padding: 12px; background: #fff; border: 1px solid var(--line2); border-radius: 12px;
    box-shadow: 0 10px 28px rgba(0,0,0,.14); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 10px; align-items: center; min-width: 300px; }
  details.filters label { color: var(--muted); font-size: 12px; }
  details.filters select { min-height: 30px; border: 1px solid var(--line2); border-radius: 8px; padding: 0 6px; background: #fff; max-width: 260px; }
  .tools { display: inline-flex; gap: 4px; margin-left: auto; }
  .tools button { width: 40px; padding: 0; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 390px; min-height: 0; overflow: hidden; }
  main > * { min-width: 0; }
  .boardcol { display: flex; flex-direction: column; min-height: 0; background: var(--soft); }
  #cy { flex: 1; min-height: 0; cursor: grab; background-color: var(--soft); }
  .legendbar { display: flex; flex-direction: column; gap: 8px; padding: 10px 20px; border-top: 1px solid var(--line); background: #fff; font-size: 12px; color: #3a3a3f; }
  .legendbar .lrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .legendbar .lrow > b { font-weight: 600; color: var(--ink); }
  .legendbar .lrow > b.gap { margin-left: 6px; }
  .legendbar span { display: inline-flex; align-items: center; gap: 6px; }
  .legendbar .k { flex: none; width: 18px; height: 12px; border-radius: 3px; }
  .legendbar .k:has(i) { box-sizing: border-box; overflow: hidden; display: flex; background: #fff; }
  .legendbar .k i { display: block; width: 6px; align-self: stretch; }   /* the sample's bar, its full height */
  .legendbar .k.dchip { height: 9px; }   /* not .chip: that is the panel's chips */
  .legendbar .k.foot { flex-direction: column; justify-content: flex-end; }
  .legendbar .k.foot i { width: auto; height: 4px; }
  aside { border-left: 1px solid var(--line); background: #fff; overflow-y: auto; padding: 18px 20px 28px; }
  aside h2 { font-size: 19px; margin: 0; line-height: 1.3; letter-spacing: -.01em; }
  aside h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 18px 0 8px; }
  .dmeta { font-size: 12px; color: var(--muted); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; min-height: 24px; padding: 0 10px; border-radius: 12px; background: var(--donebg); color: #3a3a3f; font-size: 11.5px; font-weight: 600; }
  .badge.ready { background: #fff; color: var(--okink); border: 1.5px solid var(--ok); }
  .badge.blocked { background: #fff; color: var(--badink); border: 1.5px solid var(--bad); }
  .badge.done { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 5px; min-height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--line2); background: #fff; font-size: 12px; cursor: pointer; }
  .chip.done { background: var(--donebg); border-color: transparent; color: var(--muted); }
  .chip.unmet { border-color: var(--bad); color: var(--badink); }
  .chip button.x { min-height: 20px; width: 20px; padding: 0; border: 0; border-radius: 10px; background: transparent; margin-right: -6px; }
  .chip button.x:hover { background: #ededf0; }
  input.addneed { width: 96px; min-height: 28px; padding: 0 10px; border: 1px dashed #c7c7cc; border-radius: 14px; font-size: 12px; }
  .notes p { margin: 0 0 6px; word-break: break-word; color: #3a3a3f; }
  .notes a.link, .doc a, a.link { color: var(--accent); cursor: pointer; text-decoration: none; word-break: break-all; font-weight: 500; }
  .notes a.link:hover, .doc a:hover, a.link:hover { text-decoration: underline; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .actions button { min-height: 44px; padding: 0 16px; font-size: 13px; border-radius: 11px; }
  .opengroup { position: relative; display: inline-flex; }   /* Open <main document> | All N: the list of its documents */
  .opengroup > button.opendoc { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  details.docmenu > summary { list-style: none; box-sizing: border-box; display: flex; align-items: center; gap: 5px; min-height: 44px; height: 100%; padding: 0 12px;
    background: var(--accent); color: #fff; border: 1px solid var(--accent); border-left-color: rgba(255,255,255,.45); border-radius: 0 11px 11px 0;
    font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  details.docmenu > summary::-webkit-details-marker { display: none; }
  details.docmenu > summary:hover, details.docmenu[open] > summary { filter: brightness(.92); }
  details.docmenu .menu { position: absolute; left: 0; top: calc(100% + 4px); z-index: 30; width: max-content; min-width: 100%; max-width: 360px; padding: 4px;
    background: #fff; border: 1px solid var(--line2); border-radius: 11px; box-shadow: 0 10px 28px rgba(0,0,0,.14); display: flex; flex-direction: column; }
  .actions details.docmenu .menu button { justify-content: flex-start; flex-wrap: wrap; text-align: left; border: 0; border-radius: 8px; min-height: 34px; padding: 5px 10px; font-size: 12.5px; font-weight: 500; }
  .actions details.docmenu .menu button:hover { background: #eef3fe; }
  details.docmenu .dname { word-break: break-all; }
  textarea { width: 100%; min-height: 48px; resize: vertical; border: 1px solid var(--line2); border-radius: 11px; padding: 8px 10px; font-size: 12.5px; }
  input[type=text] { flex: 1; min-width: 120px; border: 1px solid var(--line2); border-radius: 8px; padding: 4px 8px; }
  .muted { color: var(--faint); }
  .msg { margin: 8px 0; padding: 7px 10px; border-radius: 10px; background: #e7f4ec; color: var(--okink); display: none; }
  .msg.err { background: #fdeceb; color: var(--badink); }
  .warn { color: var(--warn); margin: 4px 0; }
  .seg { display: flex; gap: 2px; padding: 3px; background: #ededf0; border-radius: 11px; }
  .seg button { flex: 1; border: 0; background: transparent; color: #3a3a3f; border-radius: 9px; min-height: 38px; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  dl.facts { margin: 14px 0 0; padding-top: 14px; border-top: 1px solid #ececf0; display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 12px; font-size: 13px; line-height: 1.4; }
  dl.facts dt { color: var(--faint); }
  dl.facts dd { margin: 0; min-width: 0; }
  .legend { display: grid; grid-template-columns: 26px 1fr; gap: 6px 8px; align-items: center; font-size: 12px; color: #3a3a3f; }
  .sw { width: 22px; height: 14px; border-radius: 5px; border: 1px solid #d9d9de; background: #fff; }
  .donebox { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; margin: 10px 0 8px; }
  .donebox input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--ok); flex: none; cursor: pointer; }
  .donebox h2 { margin: 0; }
  .donebox + textarea.outcome { display: block; width: calc(100% - 34px); margin: -2px 0 10px 34px; }   /* under the task's name, lined up with it */
  .docs { display: flex; flex-direction: column; gap: 6px; }
  .doc { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .tiny { font-size: 11px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line2); color: var(--muted); }
  .tiny.bad { color: var(--badink); border-color: var(--bad); }
  .sessionbox { background: var(--soft); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 14px 0 0; display: flex; flex-direction: column; gap: 6px; }
  .sessionbox .live { color: var(--okink); font-size: 12px; font-weight: 600; }
  .sessionbox .shead { font-size: 12px; font-weight: 600; color: var(--muted); }
  .steps { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; } .steps.all { color: var(--okink); }
  .checklist { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 8px; margin: 14px 0 0; }
  .checklist .chead { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); }
  .checklist .chead b { color: var(--ink); font-size: 13px; }
  .checklist .cbar { height: 4px; border-radius: 2px; background: #ececf0; margin: 8px 0 4px; overflow: hidden; }
  .checklist .cbar i { display: block; height: 100%; background: var(--ok); }
  .checklist .step { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 13px; line-height: 1.4; cursor: pointer; }
  .checklist .step input { flex: none; width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--ok); cursor: pointer; }
  .checklist .step.done span { color: var(--muted); text-decoration: line-through; }
  .checklist .steprow { display: flex; align-items: flex-start; gap: 4px; }
  .checklist .steprow .step { flex: 1; min-width: 0; }
  .checklist .steprow .x { flex: none; width: 26px; height: 26px; margin-top: 3px; border: 0; border-radius: 13px; background: transparent; color: var(--faint); font-size: 16px; line-height: 1; cursor: pointer; opacity: 0; }
  .checklist .steprow:hover .x, .checklist .steprow .x:focus { opacity: 1; }
  .checklist .steprow .x:hover { background: #ececf0; color: var(--ink); }
  .checklist .addstep { width: 100%; min-height: 34px; margin: 6px 0 4px; padding: 0 10px; border: 1px dashed var(--line2); border-radius: 9px; font: inherit; font-size: 13px; background: #fff; }
  .checklist.empty { padding-bottom: 10px; }
  .runbox { background: #fcf5f1; border: 1px solid #f1ddd1; border-radius: 14px; padding: 12px 14px; margin: 14px 0 0; }
  .runbox.quiet { background: #fff6ea; border-color: #f0c99a; }
  .runbox .shead { font-size: 12px; font-weight: 600; color: #8a3b1f; margin-bottom: 6px; }
  .runbox dl { margin: 0; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 6px 10px; font-size: 13px; line-height: 1.4; }
  .runbox dt { color: var(--faint); } .runbox dd { margin: 0; } .runbox dd.look { color: var(--warn); font-weight: 600; }
  .sessionbox code { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; word-break: break-all; }
  details.line { margin-top: 14px; font-size: 12px; color: var(--muted); }
  details.line summary { cursor: pointer; }
  details.line p { margin: 6px 0 0; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; line-height: 1.5; word-break: break-all; color: #3a3a3f; }
  .counts { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 12.5px; color: #3a3a3f; }
  .todo { display: flex; flex-direction: column; gap: 6px; }
  .todo div { display: flex; gap: 10px; align-items: flex-start; padding: 9px 11px; border: 1px solid #ececf0; border-radius: 12px; background: #fff; cursor: pointer; }
  .todo div:hover { border-color: #b4b4bb; }
  .todo .k { flex: none; width: 16px; padding-top: 2px; font-size: 12px; color: var(--muted); text-align: right; }
  .todo .rm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .todo .l1 { font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
  .todo .l1 .id { color: var(--faint); margin-right: 4px; }
  .todo .l2 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 11.5px; color: var(--muted); }
  .todo .l2 .ic { display: inline-flex; align-items: center; gap: 4px; }
  .pill { display: inline-flex; align-items: center; min-height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11px; font-weight: 600; border: 1px solid #d7d7dc; color: #3a3a3f; background: #fff; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="ptitle">
      <span id="ptile" class="ptile" aria-hidden="true"></span>
      <div class="ptext"><h1 id="title">Taskflow</h1><span id="psub" class="psub"></span></div>
      <span id="pdls" class="dls" aria-label="Deadlines"></span>
    </div>
    <span id="sync">connecting…</span>
    <button id="b-hooks" title="Add a Hookmark (hook://) line under every file:// line that lacks one" style="display:none">Add Hookmark links</button>
    <button id="b-tracker" title="Open the tracker file in its default app">Open tracker</button>
  </header>
  <div class="toolbar">
    <span class="nav">
      <button id="b-active" title="Zoom to show every task for you: yours (@owner(me)), not done, every prerequisite done. Key: a">For you</button>
      <button id="b-prev" aria-label="Previous task for you" title="Previous task for you. Key: p">&#x2039;</button>
      <button id="b-next" class="primary" title="Next task for you, highest ranked first: high priority first and low last; then, within each priority, how much finishing it frees Claude to work (each Claude task waiting on it counts 1, shared among everything that task still waits for; a hand-off counts half; not for a task you are waiting on); waiting after the rest; then tasks whose finishing starts one of Claude's own tasks, then a hand-off, then anything else, then nothing; then more items downstream; then in progress before open; then left to right on the board. Key: n">Next &#x203A;</button>
      <span id="nav-pos"></span>
    </span>
    <div class="search"><svg class="i" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="#636366" stroke-width="1.6"/><path d="M10.5 10.5L14 14" stroke="#636366" stroke-width="1.6" stroke-linecap="round"/></svg><input id="f-search" type="search" placeholder="Search id, title, notes" aria-label="Search this board"></div>
    <div class="seg" role="group" aria-label="Show">
      <button id="v-open" aria-pressed="true" title="The tasks not done yet">All open</button>
      <button id="v-ready" aria-pressed="false" title="Only the tasks whose prerequisites are all done">Ready only</button>
      <button id="v-done" aria-pressed="false" title="Done tasks too">With done</button>
    </div>
    <input id="f-ready" type="checkbox" hidden><input id="f-done" type="checkbox" hidden>
    <details class="filters" id="filters">
      <summary title="Show only one owner's, one type's or one session's tasks">Filters <span id="fcount"></span></summary>
      <div class="menu">
        <label for="f-owner">Owner</label><select id="f-owner"><option value="">all</option><option value="me">You</option><option value="claude">Claude</option></select>
        <label for="f-type">Type</label><select id="f-type"><option value="">all</option><option value="review">review</option><option value="work">work package</option><option value="session">session hand-off</option><option value="action">action</option></select>
        <label for="f-session">Session</label><select id="f-session" title="Show the items that come from one Claude Code session (@sessionid)"><option value="">all</option></select>
      </div>
    </details>
    <span class="tools">
      <button id="b-layout" aria-label="Re-layout" title="Re-layout: arrange the visible boxes afresh"><svg class="i" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="#3a3a3f" stroke-width="1.4"><rect x="1.5" y="2" width="5" height="4" rx="1"/><rect x="9.5" y="2" width="5" height="4" rx="1"/><rect x="5.5" y="10" width="5" height="4" rx="1"/><path d="M4 6v2h8V6M8 8v2"/></g></svg></button>
      <button id="b-fit" aria-label="Fit" title="Fit the visible boxes to the window"><svg class="i" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="#3a3a3f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </span>
  </div>
  <main>
    <div class="boardcol">
      <div id="cy"></div>
      <div class="legendbar" aria-label="Legend">
        <div class="lrow"><b>Bar: who acts</b>
          <span><span class="k" style="border:1px solid #dedee3;"><i style="background:#2563eb"></i></span>Yours</span>
          <span><span class="k" style="border:1px solid #dedee3;"><i style="background:#c96442"></i></span>Claude's</span>
          <span><span class="k" style="border:1px solid #dedee3;"><i style="background:#a21caf"></i></span>Hand-off</span>
          <span><span class="k" style="border:1px solid #dedee3;background:#f6f6f8"><i style="background:repeating-linear-gradient(45deg,#2563eb 0 2px,#fff 2px 4px)"></i></span>Blocked</span>
          <span><span class="k dchip" style="border:1px solid #e3e3e8;background:#f1f1f4"><i style="background:#2563eb;opacity:.5"></i></span>Done</span>
        </div>
        <div class="lrow"><b>Look out for</b>
          <span><span class="k" style="border:2px solid #2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.16)"></span>For you now</span>
          <span><span class="k foot" style="border:1px solid #dedee3"><i style="background:#fbe7dc;border-top:1px solid #c96442"></i></span>Claude running, for how long</span>
          <span><span class="k" style="border:2px solid #d9822b;box-shadow:0 0 0 3px rgba(217,130,43,.18)"></span>Quiet: check it</span>
          <span><svg width="26" height="10" viewBox="0 0 26 10" aria-hidden="true"><path d="M1 5h19" stroke="#1a73e8" stroke-width="2"/><path d="M19 1.5l5 3.5-5 3.5z" fill="#1a73e8"/></svg>Selected task's chain; the rest fades</span>
          <b class="gap">Arrows</b>

// Scrolling moves the board like a web page: two fingers on a trackpad, a mouse wheel, Shift-wheel sideways.
// Only a pinch, or ⌘/Ctrl-scroll, zooms. Cytoscape's own wheel handling zooms on every scroll, so it is off (userZoomingEnabled: false).

      h("span", { class: "live", "data-sid": sid })),   // "running in VS Code", once the server finds it running
    // Go to session: shown only while the session runs; brings its VS Code panel or Ghostty tab forward
    h("button", { class: "primary goto", "data-sid": sid, hidden: "hidden", title: "Bring this session's window to the front", onclick: () => gotoSession(sid) }, "Go to session"),
    h("button", { title: s.resume || "", onclick: () => copyText(s.resume || ("claude --resume " + sid), "Resume command copied. Paste it into a terminal.") }, "Copy resume command"),
    h("button", { title: sid, onclick: () => copyText(sid, "Session id copied.") }, "Copy id"));
}
function sessionsOverview() {
  const ids = Object.keys(state.sessions || {});
  if (!ids.length) return [];
  return [h("h3", {}, "Claude Code sessions"),
    h("div", { class: "counts" }, ids.map((sid) => {
      const open = state.items.filter((i) => !i.done && i.sessionids.includes(sid)).length;
      return [h("span", {}, h("a", { class: "link", title: "Show only this session's items", onclick: () => { el("f-session").value = sid; afterChange(); } }, sessionName(sid))),
        h("b", { title: "open items" }, open)];
    }))];
}
// Its checklist: the indented "- " lines under the task, as TaskPaper shows them; a step is ticked with
// @done on its own line, here, in the hub, or in TaskPaper. Deeper steps are indented.
function checklistBox(it, ro, onTick) {
  const cl = it.checklist || [];
  if (!cl.length && (it.done || ro)) return [];
  const done = cl.filter((c) => c.done).length;
  const add = h("input", { class: "addstep", id: "i-step", placeholder: cl.length ? "Add a step" : "Add a checklist step", "aria-label": "Add a step to the checklist", disabled: ro,
    onkeydown: (e) => { if (e.key === "Enter" && e.target.value.trim()) editItem(it.id, "step", { text: e.target.value.trim() }); } });
  return h("div", { class: "checklist" + (cl.length ? "" : " empty") },
    h("div", { class: "chead" }, h("b", {}, "Checklist"), cl.length ? h("span", {}, done + " of " + cl.length + " done") : h("span", {}, "none yet")),
    cl.length ? h("div", { class: "cbar", "aria-hidden": "true" }, h("i", { style: "width:" + Math.round((100 * done) / cl.length) + "%" })) : [],
    cl.map((c) => h("div", { class: "steprow" },
      h("label", { class: "step" + (c.done ? " done" : ""), style: c.depth ? "padding-left:" + c.depth * 22 + "px" : false },
        h("input", { type: "checkbox", checked: c.done ? "checked" : false, disabled: ro, onchange: (e) => onTick(c, e.target.checked) }),
        h("span", {}, c.text)),
      ro ? [] : h("button", { class: "x", "aria-label": "Remove the step " + c.text, title: "Remove this step",
        onclick: () => editItem(it.id, "unstep", { line: c.line, expected: c.raw }) }, "×"))),
    it.done ? [] : add);
}
function clockText(t) {   // 12:40 today, else Oct 9, 12:40
  const hm = t.toTimeString().slice(0, 5);
  return t.toDateString() === new Date().toDateString() ? hm : t.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + ", " + hm;
}
function activityText(a) {   // what the server knows of a run, as the hub says it: [text, needs a look]
  if (!a) return ["not known: the server is older than this page", false];
  if (a.job) return ["a registered " + a.job.kind + " job", false];
  if (a.registry_unreadable) return ["the job registry could not be read", true];
  if (!a.sessions) return ["no @sessionid: cannot tell which session runs it", true];
  if (!a.last) return ["the session's transcript was not found", true];
  return a.idle ? ["no session activity for " + minutesText(a.quiet_min) + ": still running?", true] : ["session active " + minutesText(a.quiet_min) + " ago", false];
}
function runBox(it) {   // Claude's work in progress: how long it has run, and whether its session is still going
  if (!running(it)) return [];
  const t = runStart(it), [act, look] = activityText(it.activity);
  return h("div", { class: "runbox" + (look ? " quiet" : "") },
    h("div", { class: "shead" }, "Claude's run"),
    h("dl", {},
      h("dt", {}, "Running"), h("dd", {}, t ? "since " + clockText(t) + " · " + minutesText((Date.now() - t) / 60000) : "start not recorded"),
      h("dt", {}, "Activity"), h("dd", { class: look ? "look" : "" }, act)));
}
function sessionBox(it) {
  const handoff = it.type === "session";
  if (!handoff && !it.tags.session && !it.sessionids.length) return [];
  const prompts = it.notes.filter((n) => /^Prompt:\s*/.test(n)).map((n) => n.replace(/^Prompt:\s*/, ""));
  const resume = it.sessionids.length ? null : it.notes.find((n) => /claude --resume/.test(n));
  return h("div", { class: "sessionbox" },
    h("div", { class: "shead" }, handoff ? "Go back to this Claude Code session" : "From Claude Code session" + (it.sessionids.length > 1 ? "s" : "")),
    it.sessionids.length ? it.sessionids.map(sessionRow)
      : h("div", {}, it.tags.session || "(not named)", " ", h("span", { class: "tiny bad", title: "Add @sessionid(<full session id>) to the item" }, "no @sessionid")),
    resume ? h("div", { class: "muted" }, h("code", {}, resume)) : [],
    prompts.map((pr, k) => h("div", { class: "row" },
      h("button", { class: "primary", onclick: () => copyText(pr) }, prompts.length > 1 ? "Copy prompt " + (k + 1) : "Copy prompt"),
      h("span", { class: "muted" }, pr.length > 90 ? pr.slice(0, 87) + "…" : pr))));
}
async function copyText(s, done) {
  try {
    if (NATIVE) NATIVE.postMessage({ kind: "copy", text: s }); else await navigator.clipboard.writeText(s);
    flash(done || "Prompt copied. Paste it into the session.");
  }
  catch (e) { flash("Could not copy automatically; select the prompt in the notes instead.", true); }
}

const STATUSES = [["open", "Open"], ["inprogress", "In progress"], ["waiting", "Waiting"]];
function needsChip(id, ro, it) {   // a prerequisite, with × to remove it
  const c = chip(id, "need");
  if (!ro) c.append(h("button", { class: "x", "aria-label": "Remove " + id + " from what " + it.id + " needs", title: "Remove from needs",
    onclick: (e) => { e.stopPropagation(); edit("needs", { needs: it.needs.filter((n) => n !== id) }); } }, icon("x", 10, "#636366")));
  return c;
}
function renderItem(it) {
  const stateBadge = it.done ? h("span", { class: "badge done" }, "Done " + (it.tags.done || ""))
    : it.ready ? h("span", { class: "badge ready" }, "Ready") : h("span", { class: "badge blocked" }, "Blocked");
  const ro = it.readonly, firstDoc = it.docs[0];
  const who = it.type === "session" ? "hand-off" : it.owner === "me" ? "for you" : it.owner === "claude" ? "Claude's" : it.owner ? "owner: " + it.owner : "";
  const sub = it.section.split(" / ").slice(1).join(" / ");
  const addNeed = h("input", { class: "addneed", id: "i-needs", placeholder: "Add an id", "aria-label": "Add a prerequisite by its id", disabled: ro,
    onkeydown: (e) => { if (e.key === "Enter" && e.target.value.trim()) edit("needs", { needs: it.needs.concat(e.target.value.split(/[\s,;]+/).filter(Boolean)) }); } });
  return [
    h("div", { class: "dmeta" }, [it.type, who, it.id, sub].filter(Boolean).join(" · ")),
    h("label", { class: "donebox" },
      Object.assign(h("input", { type: "checkbox", id: "c-done", checked: it.done ? "checked" : false, disabled: ro,
        onchange: (e) => { keepVisible.add(it.id); editItem(it.id, e.target.checked ? "done" : "reopen", { note: el("t-done").value }); } }),
        { indeterminate: !it.done && it.status === "inprogress" }),   // in progress: the box shows a dash
      h("h2", {}, it.title)),
    h("textarea", { id: "t-done", class: "outcome", placeholder: it.done ? "Optional: why it is being reopened (type before unticking)" : "Optional: one-line outcome, saved as a dated note when you tick the box" }),   // under the tick box and the task's name
    h("div", { class: "badges" }, stateBadge,
      it.priority === "high" ? h("span", { class: "badge" }, icon("star", 11, "#3a3a3f"), "High priority") : it.priority ? h("span", { class: "badge" }, it.priority === "low" ? "Low priority" : "Priority " + it.priority) : []),
    it.done ? [] : h("div", { class: "seg", role: "group", "aria-label": "Status" }, STATUSES.map(([v, name]) =>
      h("button", { "aria-pressed": (it.status || "open") === v ? "true" : "false", disabled: ro, onclick: () => { if ((it.status || "open") !== v) edit("status", { status: v }); } }, name))),
    firstDoc ? h("div", { class: "actions" }, openDocs(it, it.id)) : [],
    checklistBox(it, ro, (c, done) => editItem(it.id, "check", { line: c.line, expected: c.raw, done })),
    h("h3", {}, "Add a note"), h("textarea", { id: "t-note", placeholder: "Saved as a dated line under the task" }),   // right below the checklist
    h("div", { class: "row" }, h("button", { disabled: ro, onclick: () => edit("note", { note: el("t-note").value }) }, "Add note")),
    msgBox(),
    runBox(it),   // Claude's run and its session come before Needs too
    sessionBox(it),
    h("dl", { class: "facts" },
      h("dt", {}, "Needs"), h("dd", {}, h("div", { class: "chips" }, it.needs.map((n) => needsChip(n, ro, it)), addNeed)),
      h("dt", {}, "Needed by"), h("dd", {}, it.needed_by.length ? h("div", { class: "chips" }, it.needed_by.map((n) => chip(n))) : h("span", { class: "muted" }, "Nothing")),
      h("dt", {}, "Documents"), h("dd", {}, it.docs.length ? h("div", { class: "docs" }, it.docs.map(docRow)) : h("span", { class: "muted" }, "None linked")),
      h("dt", {}, "Notes"), h("dd", {}, (() => { const ns = it.notes.filter((n) => !BARE_URL.test(n)); return ns.length ? h("div", { class: "notes" }, ns.map(noteLine)) : h("span", { class: "muted" }, "No notes"); })())),
    ro ? h("p", { class: "warn" }, "This item is read-only here (missing or duplicate @id); edit it in TaskPaper.") : [],
    h("details", { class: "line" }, h("summary", {}, "Line in the file"), h("p", {}, "line " + (it.line + 1) + ": " + it.raw.trim())),
  ];
}

const APP_NAME = { vscode: "VS Code", ghostty: "Ghostty", terminal: "Terminal" };
function markRunning(sids, url, still) {   // reveal Go to session for the sessions that run now; still(): the same task is shown
  if (!sids.length) return;
  api(url + "ids=" + encodeURIComponent(sids.join(","))).then((r) => {
    if (!r.ok || !still()) return;
    Object.entries(r.data).forEach(([sid, x]) => document.querySelectorAll("[data-sid='" + sid + "']").forEach((n) => {
      if (n.classList.contains("goto")) n.hidden = false;
      else n.textContent = " ● running in " + (APP_NAME[x.app] || "another app") + (x.status === "busy" ? ", working" : "");
    }));
  });
}
async function gotoSession(sid) {
  const r = await api("/api/session/focus", { sid });
  flash(r.ok ? r.data.message : r.data.error || "Error " + r.status, !r.ok);
}
function renderPanel() {
  const p = el("panel"), it = selectedId && byId(selectedId);
  p.replaceChildren(...[].concat(it ? renderItem(it) : renderOverview()).flat(Infinity));
  if (it) markRunning(it.sessionids, "/api/sessions/running?", () => selectedId === it.id);
}

async function edit(op, args) { return editItem(selectedId, op, args); }
function toggleDone(id) {
  const it = byId(id);
  if (!it || it.readonly) { flash("This item is read-only here; edit it in TaskPaper.", true); return; }
  keepVisible.add(id);
  editItem(id, it.done ? "reopen" : "done", {});
}
async function editItem(id, op, args) {
  const it = byId(id);
  if (!it || busy) return;
  busy = true;
  const r = await api("/api/edit", { id: it.id, expected_line: it.raw, op, args });
  busy = false;
  if (r.ok) { render(r.data); flash("Saved to " + r.data.name + "."); setSync("saved " + new Date().toLocaleTimeString()); }
  else if (r.status === 409) { if (r.data.state) render(r.data.state); flash(r.data.error + " The board has been refreshed; redo the change if it is still needed.", true); }
  else flash(r.data.error || "Error " + r.status, true);
}
async function openLink(url) {
  const r = await api("/api/open", { url });
  if (!r.ok) flash(r.data.error || "Could not open the link.", true);
  else if (r.data.message) flash(r.data.message);   // an app or script: shown in Finder, not run
}

function setSync(t) { el("sync").textContent = t; el("sync").classList.toggle("off", /not reachable|not running/.test(t)); }
let lastFull = 0;   // when the state was last loaded: Claude's running times and quiet flags are refreshed once a minute
async function poll() {
  const r = await api("/api/version");
  if (!r.ok) { setSync("server not reachable"); return; }
  if (!state || r.data.hash !== state.hash) {
    const s = await api("/api/state");
    if (s.ok) { render(s.data); setSync("updated from file " + new Date().toLocaleTimeString()); }
  } else if (state.items.some(running) && Date.now() - lastFull > 60000) {
    const s = await api("/api/state");
    if (s.ok) render(s.data);
    setSync("in sync " + new Date().toLocaleTimeString());
  } else setSync("in sync " + new Date().toLocaleTimeString());
}

["f-done", "f-ready", "f-owner", "f-type", "f-session"].forEach((id) => el(id).addEventListener("change", afterChange));
el("f-search").addEventListener("input", () => applyFilters());
el("b-layout").addEventListener("click", () => { runLayout(); afterChange(); });
function syncShow() {   // the All open / Ready only / With done switch shows the two filters it sets
  const ready = el("f-ready").checked, done = el("f-done").checked;
  el("v-open").setAttribute("aria-pressed", !ready && !done ? "true" : "false");
  el("v-ready").setAttribute("aria-pressed", ready && !done ? "true" : "false");
  el("v-done").setAttribute("aria-pressed", done ? "true" : "false");
}
[["v-open", false, false], ["v-ready", true, false], ["v-done", false, true]].forEach(([id, ready, done]) => el(id).addEventListener("click", () => {
  if (!cy) return;
  el("f-ready").checked = ready; el("f-done").checked = done;
  afterChange();
}));
document.addEventListener("click", (e) => { const f = el("filters"); if (f.open && !f.contains(e.target)) f.open = false;
  document.querySelectorAll("details.docmenu[open]").forEach((d) => { if (!d.contains(e.target)) d.open = false; }); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { el("filters").open = false; document.querySelectorAll("details.docmenu[open]").forEach((d) => { d.open = false; }); } });
el("b-active").addEventListener("click", () => showActive());
el("b-next").addEventListener("click", () => stepActive(1));
el("b-prev").addEventListener("click", () => stepActive(-1));
document.addEventListener("keydown", (e) => {   // n, p, a: next, previous, all active tasks; + and −: zoom the board; not while typing
  const t = e.target;
  if (e.metaKey || e.ctrlKey || e.altKey || t.isContentEditable || t.tagName === "TEXTAREA" || t.tagName === "SELECT"
    || (t.tagName === "INPUT" && !["checkbox", "radio", "button"].includes(t.type))) return;
  const zoomIn = () => zoomStep(ZOOM_KEY_STEP), zoomOut = () => zoomStep(1 / ZOOM_KEY_STEP);
  const act = { n: () => stepActive(1), p: () => stepActive(-1), a: () => showActive(), "+": zoomIn, "=": zoomIn, "-": zoomOut, "_": zoomOut }[e.key];
  if (act) { e.preventDefault(); act(); }
});
el("b-fit").addEventListener("click", () => cy && cy.fit(visibleElements(), 30));
el("b-tracker").addEventListener("click", () => api("/api/open", { url: "tracker" }));
el("b-hooks").addEventListener("click", async () => {
  if (busy) return;
  busy = true; el("b-hooks").disabled = true; el("b-hooks").textContent = "Adding Hookmark links…";
  const r = await api("/api/add-hooks", {});
  busy = false; el("b-hooks").disabled = false;
  if (r.data && r.data.state) render(r.data.state);
  if (r.ok) flash("Added " + r.data.added + " Hookmark link(s)." + (r.data.problems.length ? " Problems: " + r.data.problems.join("; ") : ""), r.data.problems.length > 0);
  else flash(r.data.error || "Could not add Hookmark links.", true);
});

(async function start() {
  const s = await api("/api/state");
  if (!s.ok) { el("panel").textContent = s.data.error || "Could not load the tracker."; return; }
  render(s.data);
  setSync("loaded " + new Date().toLocaleTimeString());
  if (NATIVE) NATIVE.postMessage({ kind: "loaded", items: s.data.items.length, sessions: Object.keys(s.data.sessions || {}).length, savedPositions: SAVED_POSITIONS });
  setInterval(poll, POLL_MS);
})();
</script>
